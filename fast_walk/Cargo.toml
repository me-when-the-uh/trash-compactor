[package]
name = "fast_walk"
version = "0.1.0"
edition = "2021"
description = "Parallel directory walk + stat + filter for trash-compactor"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.3" }
rayon = "=1.12.0"
flate2 = "=1.1.10"
lz4 = "=1.28.1"

[features]
# maturin enables this when it builds the wheel. Without it, `cargo test`
# links against the interpreter.
extension-module = ["pyo3/extension-module"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
