[package]
name = "fast_walk"
version = "0.1.0"
edition = "2021"
description = "Parallel directory walk + stat + filter for trash-compactor"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
